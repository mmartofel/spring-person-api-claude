version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install JDK 21
          command: |
            sudo apt-get update && sudo apt-get install -y openjdk-21-jdk-headless maven
            echo 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$BASH_ENV"
      - restore_cache:
          key: maven-{{ checksum "pom.xml" }}
      - run:
          name: Build and test
          command: mvn -B verify
      - run:
          name: Render every deploy overlay (docs/DEPLOY-CONVENTION.md)
          command: |
            curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar -xz -C /tmp
            for dir in deploy/overlays/* deploy/environments/example; do
              echo "== $dir"; /tmp/kustomize build "$dir" > /dev/null
            done
      - run:
          name: Check the OpenAPI contract is committed
          command: git status --porcelain contract/ && test -z "$(git status --porcelain contract/)"
      - save_cache:
          key: maven-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      - store_test_results:
          path: target/surefire-reports
      - store_test_results:
          path: target/failsafe-reports

workflows:
  build:
    jobs:
      - build
