# Runtime settings of the API with defaults that hold in any cluster: the stack's Services in the same namespace. An
# environment overlay patches a value only when its stack differs (docs/DEPLOY-CONVENTION.md section 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-person-api-config
  labels:
    app.kubernetes.io/name: spring-person-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: person-app
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  # Tokens are checked against the realm's JWK set inside the cluster, whatever public host issued them.
  KEYCLOAK_URL: http://keycloak:8080
  REALM: person
