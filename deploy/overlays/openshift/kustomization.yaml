# OpenShift, any cluster and namespace: the base, a Route for the API (Swagger UI, machine clients; host generated by
# OpenShift) and the Topology view's labels. Keycloak has no Route: browsers reach the realm through the UI's host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route.yaml
patches:
  - path: topology-api.yaml
  - path: topology-postgres.yaml
  - path: topology-keycloak.yaml
