apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-person-api
spec:
  selector:
    matchLabels:
      app: spring-person-api
  template:
    metadata:
      labels:
        app: spring-person-api
    spec:
      containers:
        - name: spring-person-api
          image: spring-person-api
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/persons
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: postgres, key: username }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
            - name: JWK_SET_URI
              value: http://keycloak:8080/realms/person/protocol/openid-connect/certs
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spring-person-api
spec:
  selector:
    app: spring-person-api
  ports:
    - port: 8080
