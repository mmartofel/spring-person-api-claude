apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  - routes.yaml
patches:
  # Keycloak sits behind the TLS edge Route: trust X-Forwarded-* so it issues https URLs.
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_PROXY_HEADERS
          value: xforwarded
