server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: spring-person-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/persons}
    username: ${SPRING_DATASOURCE_USERNAME:persons}
    password: ${SPRING_DATASOURCE_PASSWORD:persons}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/realms/person/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
    group:
      readiness:
        include: readinessState,db

springdoc:
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
